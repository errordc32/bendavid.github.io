<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <p class="footer-name">{{ site.author.name }}</p>
      <p class="muted">{{ site.tagline }} · {{ site.author.location }}</p>
    </div>
    <div class="footer-links">
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      {% if site.author.linkedin != "" %}<a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
      {% if site.author.github != "" %}<a href="{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
      {% if site.resume %}<a href="{{ site.resume | relative_url }}" target="_blank" rel="noopener">Resume</a>{% endif %}
    </div>
  </div>
  <div class="container">
    <p class="muted small">© {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
  </div>
</footer>
