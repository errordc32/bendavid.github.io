<header class="site-header">
  <div class="container nav-bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">BM</span>
      <span class="brand-name">{{ site.author.name }}</span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav">
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}class="active"{% endif %}>Projects</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
      {% if site.resume %}<a href="{{ site.resume | relative_url }}" target="_blank" rel="noopener">Resume</a>{% endif %}
      <a class="btn btn-small" href="mailto:{{ site.author.email }}">Contact</a>
    </nav>
  </div>
</header>
