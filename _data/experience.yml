- org: UCSD Morimoto Robotics Lab
  role: Undergraduate Researcher
  location: La Jolla, CA
  period: 2025 – Present
  bullets:
    - Designed nitinol wristed robotic instruments for non-invasive surgical removal of cancerous colonic polyps.
    - Fabricated robots by CNC milling, then redesigned the production workflow with sinker-EDM HSS jigging and wire EDM, cutting machining time from 4 hours to 23 minutes.
    - Integrated the control scheme using micro-ROS for actuation and built a VM-based TCP–ROS bridge for high-frequency, time-synced data from inline load cells, 6-axis load sensors, and EM position tracking.
    - Designed and fabricated a sub-millimeter electrosurgical knife for endoscopic submucosal dissection.
    - Authoring a paper on minimally invasive traction-assisted polypectomy for the IEEE International Symposium on Medical Robotics.

